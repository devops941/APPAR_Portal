services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: apaar-app
    restart: always
    ports:
      - "${PORT:-3005}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - MONGODB_URI=mongodb+srv://devops_db_user:jcj8Mkf1GQKJ1ZGl@cluster0.uurxkmz.mongodb.net/apaar_student?retryWrites=true&w=majority
      - AUTH_SECRET=production_long_secure_secret_key_987654321
      - APP_URL=http://localhost:${PORT:-3005}

volumes:
  web_node_modules:
